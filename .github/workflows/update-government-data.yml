name: 更新台中政府預售屋資料

on:
  schedule:
    - cron: "30 3 1,11,21 * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Download and rebuild data
        run: python scripts/update_data.py

      - name: Commit when data changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add government-data.js launch-data.js builder-data.js data-meta.js
          git diff --cached --quiet || git commit -m "Update government housing data"
          git push